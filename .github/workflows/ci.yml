name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # changesets diffs against base branch

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: node scripts/check-packables.mjs

      # Fail PRs that touch publishable code without a changeset.
      # Skipped on main (changesets already consumed) and on the
      # version-packages PR itself (it *consumes* them, so it has none).
      - name: Changeset present
        if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/')
        run: bun changeset status --since=origin/${{ github.base_ref }}
