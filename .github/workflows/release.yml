# Publishes the package to npm.
#
# Two-step by design. A push to main that carries changesets makes this open a
# "Version Packages" pull request: version bump + generated changelog, as a diff to review.
# Merging that pull request is what publishes. Nothing reaches npm without a human approving
# the version number, and an npm version cannot be unpublished after 72 hours.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing — mints an OIDC token so npm can verify
  # the release came from this workflow in this repository, with no
  # long-lived credential and a provenance attestation on the tarball.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # changesets compares against base branch

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # npm trusted publishing (OIDC): setup-node with registry-url configures npm's .npmrc
      # for OIDC token exchange (npm publish --provenance). With packageManager bun@1.3.14,
      # changeset publish invokes bun publish; bun 1.3.14 supports OIDC via `bun publish
      # --provenance` when id-token: write is present. If OIDC fails, fallback is
      # `npm publish --provenance` explicitly (no long-lived token).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install
        run: bun install --frozen-lockfile

      # Re-verify here — publishing is irreversible, so it does not
      # inherit trust from the CI run on the same commit.
      - name: Verify
        run: bun run verify

      # Pinned by commit, not by the `v2` tag. Moving major tags are
      # the vector of CVE-2025-30066 (tags v1..v45.0.7 repointed at a
      # credential-dumping commit). This job can mint an npm token, so
      # it is the last place to accept a mutable dependency.
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One release for the version (single-package repo).
      - name: Tag and release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Single package - read version/name from package.json at the publishing commit.
          # Uses git show $GITHUB_SHA to avoid ghost-tag incident (v0.1.2) where working-tree
          # reads saw a bumped version that nothing had published, and v0.2.0 tag landing on
          # feature merge rather than publishing commit.
          name=$(git show "$GITHUB_SHA:package.json" | jq -r '.name')
          version=$(git show "$GITHUB_SHA:package.json" | jq -r '.version')

          if [ -z "$name" ] || [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Failed to read name/version from package.json at $GITHUB_SHA" >&2
            exit 1
          fi

          if [ "$version" = "0.0.0" ]; then
            echo "Refusing to tag 0.0.0 placeholder" >&2
            exit 1
          fi

          tag="v$version"
          packages="$name $version"

          {
            echo 'packages<<PACKAGES_EOF'
            echo "$packages"
            echo 'PACKAGES_EOF'
          } >> "$GITHUB_OUTPUT"

          # Tag is the record of what has been released. Every push
          # that does not bump the version finds it already there and
          # stops — makes re-runs safe.
          # Uses gh release view (not changesets/action output) - that output is regex-matched
          # from "New tag:" line; changesets v3 prints "◇ Successfully published:" so published
          # stayed false and 0.1.1 shipped with no tag/release in a green run.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released."
            echo 'released=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # CHANGELOG.md is at repo root for single-package repos (not packages/<pkg>/CHANGELOG.md)
          changelog="CHANGELOG.md"
          if [ ! -f "$changelog" ]; then
            echo "CHANGELOG.md not found, using empty release notes" >&2
            echo "# $tag" > release-notes.md
          else
            awk -v v="$version" '
              /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
              found
            ' "$changelog" > release-notes.md
            # Fallback if no notes extracted (e.g., first release)
            if [ ! -s release-notes.md ]; then
              echo "No changelog entry found for $version, using version header" >&2
              echo "## $version" > release-notes.md
            fi
          fi

          {
            printf '\n### Package\n\n'
            printf -- '- `%s@%s` — https://www.npmjs.com/package/%s/v/%s\n' "$name" "$version" "$name" "$version"
          } >> release-notes.md

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md

          echo 'released=true' >> "$GITHUB_OUTPUT"

      - name: Check dist-tags
        if: steps.release.outputs.released == 'true'
        env:
          PACKAGES: ${{ steps.release.outputs.packages }}
        run: |
          set -euo pipefail

          attempts=8
          delay=15
          pending=$PACKAGES
          for attempt in $(seq "$attempts"); do
            pending=$(
              while read -r name version _; do
                actual=$(npm view "$name@latest" version --prefer-online 2>/dev/null || true)
                [ "$actual" = "$version" ] && continue
                printf '%s %s %s\n' "$name" "$version" "${actual:-<none>}"
              done <<< "$pending"
            )
            [ -n "$pending" ] || break
            [ "$attempt" -eq "$attempts" ] || sleep "$delay"
          done

          if [ -n "$pending" ]; then
            {
              echo 'The `latest` dist-tag does not point at the released version.'
              echo
              printf '  %-34s %-10s %s\n' PACKAGE RELEASED 'latest points at'
              awk '{ printf "  %-34s %-10s %s\n", $1, $2, $3 }' <<< "$pending"
              echo
              echo 'Where the version is on the registry, the repair is:'
              echo
              awk '{ printf "  npm dist-tag add %s@%s latest\n", $1, $2 }' <<< "$pending"
              echo
              echo 'Check `release` in the root package.json for a `--tag`,'
              echo '`publishConfig.tag` in manifests, and .changeset/pre.json.'
            } >&2
            exit 1
          fi

          echo 'latest points at the released version for every package.'
